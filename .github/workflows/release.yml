name: Build and release

on:
  push:
    branches: [master]

permissions:
  contents: write

env:
  RELEASE_VERSION: 1.0.${{ github.run_number }}
  RELEASE_TAG: v1.0.${{ github.run_number }}
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build and test
        run: ./build.ps1 -Test -Version $env:RELEASE_VERSION

      - name: Package Windows x64 build
        run: |
          $archive = "artifacts/TbhStatsAnalyzer-$env:RELEASE_TAG-win-x64.zip"
          Compress-Archive -Path 'artifacts/TbhStatsAnalyzer/*' -DestinationPath $archive -Force

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $archive = "artifacts/TbhStatsAnalyzer-$env:RELEASE_TAG-win-x64.zip"
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $archive --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:RELEASE_TAG $archive --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "TbhStatsAnalyzer $env:RELEASE_TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось опубликовать релиз GitHub.' }
